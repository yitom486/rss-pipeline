[project]
name = "rss-pipeline"
version = "0.2.0"
description = "RSS 采集 → AI 翻译摘要 → Telegram 审核 → 发布 流水线"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
]

# 控制台入口：uv sync 后会在 .venv/bin/ 生成可执行脚本，
# systemd / cron 直接指向它们（既是入口、又锁定 venv 解释器）。
[project.scripts]
rss-pipeline = "rss_pipeline.pipeline:main"
rss-bot = "rss_pipeline.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_pipeline"]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.0", "pyyaml>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
